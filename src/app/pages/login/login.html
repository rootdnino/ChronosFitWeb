
<div class="login-wrapper">
  <div class="login-header">
    <img src="/logo.png" alt="Logo ChronosFit" class="app-logo">
    
    <h1 class="logo-text">CHRONOS-FIT</h1>
    <h2 class="subtitle-text">Inicia sesión para continuar</h2>
  </div>

  <form class="login-form">
    <mat-form-field appearance="outline" class="input-field">
      <mat-label>Correo Electrónico</mat-label>
      <input matInput value="diegoniar">
    </mat-form-field>

    <mat-form-field appearance="outline" class="input-field">
      <mat-label>Contraseña</mat-label>
      <input matInput type="password" value="........">
    </mat-form-field>
  </form>

  <div class="login-actions">
    <button class="btn-login" routerLink="/dashboard">Iniciar Sesión</button>
  </div>

  <div class="login-footer">
    <a routerLink="/registro-paso2" class="link-blue">Crear cuenta</a> | 
    <span class="text-dark">Olvidaste tu contraseña</span>
  </div>
</div>
